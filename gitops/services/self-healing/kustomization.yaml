apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sem isto o ConfigMap gerado (com hash) fica sem namespace e o kustomize NÃO
# atualiza a referência no Deployment (que tem namespace explícito): o pod pede
# "self-healing-config" e o ConfigMap existe só como "self-healing-config-<hash>".
namespace: togglemaster
resources:
- serviceaccount.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
# A allowlist de alertas vive no Git. Mudou o arquivo -> o nome do ConfigMap muda
# (hash) -> o pod é recriado com a regra nova.
configMapGenerator:
- name: self-healing-config
  files:
  - config.json
